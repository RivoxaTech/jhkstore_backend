<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; color: #1e293b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  main { max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: #64748b; line-height: 1.5; }
  button { height: 38px; padding: 0 18px; border: 0; border-radius: 10px; background: #1d70ca; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0e131a; color: #e7ecf3; } p { color: #a0abbc; } }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>The admin panel needs an internet connection to show your orders and products. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
