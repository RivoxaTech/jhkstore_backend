name: DeployDesk Build
on:
  push:
    branches: ["develop", "main"]
    tags: []
    paths: ["**"]
  workflow_dispatch:
concurrency:
  group: deploydesk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Composer install
        working-directory: .
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Fetch build environment from panel
        working-directory: .
        env:
          DD_URL: ${{ secrets.DEPLOYDESK_URL }}
          DD_SECRET: ${{ secrets.DEPLOYDESK_SECRET }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TS=$(date +%s)
          SIG=$(printf '%s' "$TS.env" | openssl dgst -sha256 -hmac "$DD_SECRET" | sed 's/^.* //')
          CODE=$(curl -sS -o dd-env.json -w '%{http_code}' -H "X-DD-Timestamp: $TS" -H "X-DD-Signature: $SIG" \
            "$DD_URL/api/v1/ci/projects/01m7m24jg3kvawssgvbw1mj2kr/env?ref=$REF_NAME" || echo 000)
          if [ "$CODE" != "200" ]; then echo "::error::Could not fetch build variables from the panel (HTTP $CODE). Check the panel address and secrets, then press Update workflow."; exit 1; fi
          node -e "
          const fs=require('fs');
          const v=(require('./dd-env.json').vars)||{};
          const m={};
          if(fs.existsSync('.env.production')){for(const l of fs.readFileSync('.env.production','utf8').split(/\r?\n/)){const t=l.trim();if(!t||t[0]==='#')continue;const i=t.indexOf('=');if(i>0)m[t.slice(0,i).trim()]=t.slice(i+1);}}
          for(const k in v){console.log('::add-mask::'+v[k]);m[k]=v[k];}
          console.log('Variables from the repository file: '+(Object.keys(m).filter(k=>!(k in v)).join(', ')||'none'));
          console.log('Variables from the panel: '+(Object.keys(v).join(', ')||'none'));
          fs.writeFileSync('.env.production',Object.keys(m).map(k=>k+'='+m[k]).join('\n')+'\n');"
          rm dd-env.json
      - name: Install
        working-directory: .
        run: echo "no frontend"
      - name: Build
        working-directory: .
        run: echo "no frontend build"
      - name: Check build output
        working-directory: .
        run: |
          if [ ! -d "." ]; then
            echo "::error::Build finished but the output folder '.' does not exist. Fix the Output folder in the project settings, or make the build produce it (Next.js needs output: 'export' for 'out')."
            ls -la
            exit 1
          fi
      - name: Remove what the server does not need
        # Added by hand after the DeployDesk install (docs/DEPLOYDESK.md): the release must not carry the git folder (it holds the checkout's
        # credentials), the tests, the guides or the check scripts. Done before the manifest is made, so the manifest matches the archive.
        # If the workflow is ever re-installed from the panel ("Update workflow"), put this step back.
        working-directory: .
        run: rm -rf .git .github .gitattributes .editorconfig tests docs scripts phpunit.xml serve-fast.cmd README.md CHANGELOG.md
      - name: Manifest and archive
        working-directory: ./.
        run: |
          node -e "
          const fs=require('fs'),p=require('path'),c=require('crypto'),out=[];
          (function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){
            const f=p.join(d,e.name);
            if(e.isDirectory())w(f);else{const b=fs.readFileSync(f);
            out.push({path:p.relative('.',f).split(p.sep).join('/'),size:b.length,
            sha256:c.createHash('sha256').update(b).digest('hex')});}}})('.');
          fs.writeFileSync('.deploydesk-manifest.json',JSON.stringify({files:out,
            commit:process.env.GITHUB_SHA,built_at:new Date().toISOString()}));"
          zip -qr "$GITHUB_WORKSPACE/release.zip" .
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ github.run_id }}
          path: release.zip
          retention-days: 7
      - name: Notify panel
        if: always()
        continue-on-error: true
        env:
          DD_URL: ${{ secrets.DEPLOYDESK_URL }}
          DD_SECRET: ${{ secrets.DEPLOYDESK_SECRET }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          BODY=$(node -e "const e=process.env;console.log(JSON.stringify({status:e.STATUS,
            run_id:e.RUN_ID,attempt:e.RUN_ATTEMPT,sha:e.SHA,ref:e.REF,message:e.MSG,author:e.AUTHOR}))")
          TS=$(date +%s)
          SIG=$(printf '%s' "$TS.$BODY" | openssl dgst -sha256 -hmac "$DD_SECRET" | sed 's/^.* //')
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-DD-Timestamp: $TS" \
            -H "X-DD-Signature: $SIG" -d "$BODY" \
            "$DD_URL/api/v1/ci/projects/01m7m24jg3kvawssgvbw1mj2kr/build-callback"
